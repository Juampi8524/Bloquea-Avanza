<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloquea & Avanza</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
</head>
<body>

    <div id="pantalla-inicio" class="pantalla activa">
        <h1>Bloquea & Avanza</h1>
        <p style="margin-bottom: 20px;">Hola, <span id="nombre-menu">Jugador</span>!</p>
        <button onclick="mostrarPantalla('pantalla-jugar')">Jugar</button>
        <button onclick="mostrarPantalla('pantalla-config')">Configuración</button>
    </div>

    <div id="pantalla-config" class="pantalla">
        <h1>Configuración</h1>
        <input type="text" id="input-nombre" placeholder="Tu nombre..." maxlength="12">
        
        <div class="config-item">
            <p>Color de paredes:</p>
            <input type="color" id="input-color-pared" value="#f1c40f">
        </div>

        <div class="config-item">
            <p>Avatar:</p>
            <select id="select-avatar">
                <option value="😃">😃 Sonrisa</option>
                <option value="🦊">🦊 Zorro</option>
                <option value="🤖">🤖 Robot</option>
                <option value="👽">👽 Alien</option>
            </select>
        </div>

        <button onclick="guardarConfig()">Guardar y Volver</button>
    </div>

    <div id="pantalla-jugar" class="pantalla">
        <h1>Modo de Juego</h1>
        <div class="config-item" style="margin-bottom: 20px;">
            <p>Tamaño del Tablero:</p>
            <select id="select-tamano">
                <option value="5">Micro (5x5)</option>
                <option value="7">Rápido (7x7)</option>
                <option value="9" selected>Estándar (9x9)</option>
                <option value="11">Táctico (11x11)</option>
                <option value="13">Masivo (13x13)</option>
            </select>
        </div>
        <button onclick="iniciarJuego('ia')">VS IA</button>
        <button onclick="mostrarPantalla('pantalla-salas')">Multijugador</button>
        <button class="btn-secundario" onclick="mostrarPantalla('pantalla-inicio')">Volver</button>
    </div>

    <div id="pantalla-salas" class="pantalla">
        <h1>Multijugador</h1>
        <button onclick="buscarPartidaGlobal()" style="background: #e67e22;">🌍 Buscar Partida Global</button>
        <hr style="width: 100%; border-color: #555; margin: 15px 0;">
        <button onclick="crearSala()">Crear Sala Privada</button>
        <button onclick="unirseSala()">Unirse a Sala</button>
        <button class="btn-secundario" onclick="mostrarPantalla('pantalla-jugar')">Volver</button>
    </div>

    <div id="pantalla-lobby" class="pantalla">
        <h1>Sala de Espera</h1>
        <p style="font-size: 24px; margin-bottom: 10px;">Código: <strong id="codigo-sala-display" style="color: #e67e22;">------</strong></p>
        <p id="estado-jugadores" style="font-size: 20px; margin-bottom: 20px;">Jugadores: 1/2</p>
        
        <div style="margin-bottom: 20px; text-align: left; background: #1e1e2f; padding: 15px; border-radius: 8px; border: 1px solid #4facfe; width: 100%;">
            <p id="lobby-p1" style="margin-bottom: 10px;">1. Esperando...</p>
            <p id="lobby-p2">2. Esperando...</p>
        </div>

        <button id="btn-iniciar-multijugador" onclick="iniciarDesdeLobby()" disabled style="background: #555;">Esperando rival...</button>
        <button class="btn-secundario" onclick="mostrarPantalla('pantalla-salas')">Abandonar Sala</button>
    </div>
    
    <div id="pantalla-juego" class="pantalla" style="max-width: 600px;">
        <div class="info-juego">
            <h2 id="turno-texto">Turno: Cargando...</h2>
            
            <div class="relojes">
                <div class="reloj">Total: <span id="tiempo-total">03:00</span></div>
                <div class="reloj turno">Turno: <span id="tiempo-turno">15</span>s</div>
            </div>

            <div class="controles">
                <button id="btn-mover" class="activo" onclick="cambiarAccion('mover')">Moverse</button>
                <button id="btn-pared" onclick="cambiarAccion('pared')">Poner Pared</button>
                <button id="btn-orientacion" style="display:none; background:#d35400" onclick="alternarOrientacion()">Dir: Horizontal</button>
            </div>
            <p>Tus paredes: <span id="paredes-p1">10</span></p>
        </div>
        
        <div id="contenedor-tablero" style="position: relative;">
            <div id="tablero"></div>
            <div id="ficha-p1" class="jugador-ficha">😃</div>
            <div id="ficha-p2" class="jugador-ficha">🤖</div>
        </div>

        <div id="chat-emojis" class="controles" style="margin-top: 15px;">
            <button onclick="enviarEmoji('👍')">👍</button>
            <button onclick="enviarEmoji('😡')">😡</button>
            <button onclick="enviarEmoji('🤯')">🤯</button>
            <button onclick="enviarEmoji('👏')">👏</button>
        </div>
        <div id="mensaje-chat" style="height: 24px; color: #f1c40f; margin-top: 5px;"></div>

        <button class="btn-secundario" onclick="mostrarPantalla('pantalla-inicio')">Abandonar Partida</button>
    </div>

    <audio id="sonido-mover" src="https://actions.google.com/sounds/v1/foley/footstep_single_on_wood.ogg"></audio>
    <audio id="sonido-pared" src="https://actions.google.com/sounds/v1/impacts/wood_plank_hit.ogg"></audio>
    
    <script src="script.js"></script>
</body>
</html>
